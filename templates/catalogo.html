<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Catálogo de Proveedores - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261019-v1-1-0') }}">
</head>
<body class="bg-light">
    {% include 'erp_header.html' %}

    <div class="container-fluid px-4 mb-5">
        <div class="d-flex justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <h4 class="fw-bold text-dark mb-0">Proveedores</h4>
                <small class="text-muted">A quién le compras. Aprueba a los nuevos con un clic.</small>
            </div>
            <div><a href="/admin/importar" class="btn btn-outline-primary btn-sm">Importar desde Excel</a></div>
        </div>

        <div id="aviso" class="alert alert-warning d-none"></div>
        <div id="avisoRecetario" class="alert alert-info d-none d-flex flex-wrap align-items-center gap-2 justify-content-between">
            <div id="textoRecetario"></div>
            <button type="button" class="btn btn-sm btn-primary" id="crearDelRecetario">Crear como borrador</button>
        </div>
        <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
            <input type="text" id="buscador" class="form-control" style="max-width:420px" aria-label="Buscar proveedores" placeholder="Buscar por razón social, RFC o código" autofocus>
            <div class="btn-group btn-group-sm" role="group" aria-label="Filtrar" id="filtros">
                <button type="button" class="btn btn-secondary" data-f="">Todos</button>
                <button type="button" class="btn btn-outline-secondary" data-f="Pendiente">Por aprobar <span id="nPend"></span></button>
                <button type="button" class="btn btn-outline-secondary" data-f="Activo">Activos</button>
                <button type="button" class="btn btn-outline-secondary" data-f="Bloqueado">Bloqueados</button>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Proveedor</th>
                                <th class="d-none d-md-table-cell">Suministro</th>
                                <th class="d-none d-lg-table-cell">Domicilio (Logística)</th>
                                <th class="d-none d-md-table-cell">Contacto</th>
                                <th>Estatus</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProveedores">
                            <!-- Datos cargados mediante API -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let TODOS = [];
        let filtro = '';
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        function pintar() {
            const tbody = document.getElementById('tablaProveedores');
            const porAprobar = (p) => p.estatus === 'Pendiente' || p.estatus === 'Borrador';
            const lista = TODOS.filter(p => !filtro || (filtro === 'Pendiente' ? porAprobar(p) : p.estatus === filtro));
            document.getElementById('nPend').textContent = TODOS.filter(porAprobar).length || '';
            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">No se encontraron proveedores.</td></tr>`;
                return;
            }
            tbody.innerHTML = lista.map(p => {
                const badgeClass = p.estatus === 'Activo' ? 'bg-success' : (porAprobar(p) ? 'bg-warning text-dark' : 'bg-danger');
                const etiqueta = p.estatus === 'Activo' ? 'Bloquear' : (porAprobar(p) ? 'Aprobar' : 'Reactivar');
                const claseBtn = porAprobar(p) ? 'btn-success' : 'btn-outline-secondary';
                return `
                    <tr>
                        <td>
                            <div class="fw-bold text-dark">${esc(p.razon_social)}</div>
                            <small class="text-muted font-monospace">${esc(p.codigo_proveedor)}${p.rfc ? ' · ' + esc(p.rfc) : ''}</small>
                        </td>
                        <td class="d-none d-md-table-cell"><span class="badge bg-light text-dark border">${esc(p.tipo_proveedor)}</span></td>
                        <td class="d-none d-lg-table-cell"><small class="text-muted">${esc(p.domicilio) || '—'}</small></td>
                        <td class="d-none d-md-table-cell">
                            <div>${esc(p.contacto)}</div>
                            <small class="text-muted">${esc(p.telefono)}</small>
                        </td>
                        <td><span class="badge ${badgeClass}">${esc(p.estatus)}</span></td>
                        <td class="text-end text-nowrap">
                            <button onclick="cambiarEstatus(${Number(p.id_proveedor)}, '${esc(p.estatus)}')" class="btn btn-sm ${claseBtn} me-1">${etiqueta}</button>
                            <a href="/admin/editar/${Number(p.id_proveedor)}" class="btn btn-sm btn-outline-primary">Abrir</a>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function cargarProveedores(q = '') {
            const res = await fetch(`/api/proveedores?q=${encodeURIComponent(q)}`);
            TODOS = await res.json();
            pintar();
        }

        async function cambiarEstatus(id, estatusActual) {
            const aviso = document.getElementById('aviso');
            aviso.classList.add('d-none');
            const nuevo = estatusActual === 'Activo' ? 'Bloqueado' : 'Activo';
            const cuerpo = { estatus: nuevo };
            if (nuevo === 'Bloqueado') {
                const motivo = prompt('¿Por qué lo bloqueas? (queda en su historial)');
                if (!motivo || !motivo.trim()) return;
                cuerpo.motivo = motivo.trim();
            }
            const res = await fetch(`/api/proveedores/${id}/estatus`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cuerpo)
            });
            if (res.ok) { cargarProveedores(document.getElementById('buscador').value); return; }
            const data = await res.json().catch(() => ({}));
            const falta = (data.faltantes || []).map(f => esc(f.etiqueta || f.campo || f)).join(', ');
            aviso.innerHTML = esc(data.error || 'No se pudo cambiar el estatus.')
                + (falta ? ` Falta: <strong>${falta}</strong>.` : '')
                + ` <a href="/admin/editar/${Number(id)}" class="alert-link">Abrir proveedor</a>`;
            aviso.classList.remove('d-none');
        }

        document.getElementById('buscador').addEventListener('input', (e) => cargarProveedores(e.target.value));
        document.querySelectorAll('#filtros button').forEach(b => b.addEventListener('click', () => {
            filtro = b.dataset.f;
            document.querySelectorAll('#filtros button').forEach(x => x.className = 'btn ' + (x === b ? 'btn-secondary' : 'btn-outline-secondary'));
            pintar();
        }));

        async function revisarRecetario() {
            const caja = document.getElementById('avisoRecetario');
            try {
                const res = await fetch('/api/proveedores/del-recetario');
                const d = await res.json();
                if (!d.pendientes || !d.pendientes.length) { caja.classList.add('d-none'); return; }
                document.getElementById('textoRecetario').innerHTML =
                    'Tu recetario menciona <strong>' + d.pendientes.length + '</strong> proveedor(es) que aún no están aquí: ' +
                    d.pendientes.map(p => esc(p.nombre) + ' (' + p.materias + ')').join(', ') +
                    '. Se crean como borrador, solo con el nombre; luego los apruebas con un clic. Teléfono, RFC y domicilio son opcionales.';
                caja.classList.remove('d-none');
            } catch (e) { caja.classList.add('d-none'); }
        }
        document.getElementById('crearDelRecetario').addEventListener('click', async (e) => {
            e.target.disabled = true;
            const res = await fetch('/api/proveedores/del-recetario', { method: 'POST' });
            e.target.disabled = false;
            if (res.ok) { filtro = ''; await cargarProveedores(''); revisarRecetario(); }
        });

        cargarProveedores();
        revisarRecetario();
    </script>
</body>
</html>
