<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Catálogo de Proveedores - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260907-teal') }}">
</head>
<body class="bg-light">
    {% include 'erp_header.html' %}

    <div class="container-fluid px-4 mb-5">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-3">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h4 class="fw-bold text-dark mb-0">Catálogo General Unificado</h4>
                        <small class="text-muted">Consulta centralizada para órdenes de compra, inventarios y rutas logísticas.</small>
                    </div>
                    <div class="col-md-6">
                        <!-- Filtro de búsqueda en tiempo real -->
                        <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar por Razón Social, RFC o Código...">
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Código</th>
                                <th>Razón Social / RFC</th>
                                <th>Suministro</th>
                                <th>Domicilio (Logística)</th>
                                <th>Contacto</th>
                                <th>Estatus</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProveedores">
                            <!-- Datos cargados mediante API -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function cargarProveedores(filtro = '') {
            const res = await fetch(`/api/proveedores?q=${encodeURIComponent(filtro)}`);
            const proveedores = await res.json();
            const tbody = document.getElementById('tablaProveedores');
            tbody.innerHTML = '';

            if(proveedores.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No se encontraron proveedores registrados.</td></tr>`;
                return;
            }

            proveedores.forEach(p => {
                let badgeClass = p.estatus === 'Activo' ? 'bg-success' : (p.estatus === 'Pendiente' ? 'bg-warning text-dark' : 'bg-danger');
                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold text-secondary">${p.codigo_proveedor}</td>
                        <td>
                            <div class="fw-bold text-dark">${p.razon_social}</div>
                            <small class="text-muted font-monospace">${p.rfc}</small>
                        </td>
                        <td><span class="badge bg-light text-dark border">${p.tipo_proveedor}</span></td>
                        <td><small class="text-muted">${p.domicilio}</small></td>
                        <td>
                            <div>${p.contacto}</div>
                            <small class="text-muted">${p.telefono}</small>
                        </td>
                        <td><span class="badge ${badgeClass}">${p.estatus}</span></td>
                        <td class="text-end">
                            <button onclick="cambiarEstatus(${p.id_proveedor}, '${p.estatus}')" class="btn btn-sm btn-outline-secondary me-1" title="Cambiar Estatus">
                                ${p.estatus === 'Activo' ? 'Bloquear' : 'Aprobar / Activar'}
                            </button>
                            <a href="/admin/editar/${p.id_proveedor}" class="btn btn-sm btn-outline-primary">Expediente</a>
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarEstatus(id, estatusActual) {
            let nuevo = estatusActual === 'Activo' ? 'Bloqueado' : 'Activo';
            if(estatusActual === 'Pendiente') nuevo = 'Activo';
            
            const res = await fetch(`/api/proveedores/${id}/estatus`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estatus: nuevo })
            });
            if(res.ok) cargarProveedores(document.getElementById('buscador').value);
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            cargarProveedores(e.target.value);
        });

        cargarProveedores();
    </script>
</body>
</html>
