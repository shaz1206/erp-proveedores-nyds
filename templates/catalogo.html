<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Proveedores - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-saas navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-dark" href="/">🏢 ERP Módulo Proveedores</a>
            <div class="user-badge"><span>S</span> SHAZIET NAVARRO</div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">Catálogo de Proveedores</h4>
            <a href="/alta" class="btn btn-primary">+ Nuevo Proveedor</a>
        </div>

        <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" id="buscador" class="form-control" placeholder="Buscar por Razón Social o RFC...">
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Razón Social</th>
                                <th>RFC</th>
                                <th>Contacto</th>
                                <th>Teléfono</th>
                                <th>Estatus</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaProveedores"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', cargarProveedores);
        let proveedoresGlobal = [];

        async function cargarProveedores() {
            try {
                const res = await fetch('/api/proveedores');
                proveedoresGlobal = await res.json();
                renderizarTabla(proveedoresGlobal);
            } catch (error) {
                console.error("Error al cargar proveedores:", error);
            }
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tablaProveedores');
            tbody.innerHTML = '';
            if(!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No hay proveedores registrados.</td></tr>';
                return;
            }
            datos.forEach(p => {
                let badgeClass = p.estatus === 'Activo' ? 'bg-success' : 'bg-danger';
                let btnEstatusHtml = p.estatus === 'Activo' 
                    ? `<button class="btn btn-sm btn-outline-warning text-dark" onclick="cambiarEstatus(${p.id_proveedor})">Bloquear</button>`
                    : `<button class="btn btn-sm btn-outline-success" onclick="cambiarEstatus(${p.id_proveedor})">Desbloquear</button>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-semibold text-primary">${p.codigo_proveedor}</td>
                        <td>${p.razon_social}</td>
                        <td class="text-muted">${p.rfc}</td>
                        <td>${p.contacto}</td>
                        <td>${p.telefono || 'N/A'}</td>
                        <td><span class="badge ${badgeClass} px-2 py-1">${p.estatus}</span></td>
                        <td>
                            <a href="/editar/${p.id_proveedor}" class="btn btn-sm btn-outline-primary me-1">Expediente</a>
                            ${btnEstatusHtml}
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarEstatus(id) {
            if(confirm("¿Desea cambiar el estatus de este proveedor?")) {
                const res = await fetch(`/api/proveedores/${id}/estatus`, { method: 'PATCH' });
                const data = await res.json();
                alert(data.mensaje);
                cargarProveedores();
            }
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const f = e.target.value.toLowerCase();
            renderizarTabla(proveedoresGlobal.filter(p => p.razon_social.toLowerCase().includes(f) || p.rfc.toLowerCase().includes(f)));
        });
    </script>
</body>
</html>
