<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Crear cuenta - Tienda NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261001-tienda') }}">
</head>
<body class="bg-light login-page d-flex align-items-center justify-content-center">
    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 460px;">
        <div class="text-center mb-4">
            <div class="login-mark"><span class="nyds-logo"><img src="{{ url_for('static', filename='nyds-logo.png') }}" alt="NYDS" width="1600" height="900"></span></div>
            <h4 class="fw-bold text-dark">Crear cuenta</h4>
            <small class="text-muted">Guarda tus direcciones y revisa el estado de tus pedidos</small>
        </div>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" required value="{{ nombre or '' }}" placeholder="Ej. María Pérez">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Teléfono</label>
                <input type="text" name="telefono" autocomplete="username" class="form-control" required value="{{ telefono or '' }}" placeholder="9981234567">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Correo (opcional)</label>
                <input type="email" name="correo" class="form-control" value="{{ correo or '' }}" placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" name="password" autocomplete="new-password" class="form-control" required minlength="6">
                <div class="form-text">Mínimo 6 caracteres.</div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Confirmar contraseña</label>
                <input type="password" name="password_confirmar" autocomplete="new-password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Crear cuenta</button>
        </form>
        <div class="text-center mt-3">
            <a href="{{ url_for('tienda_login') }}" class="text-decoration-none small text-muted">¿Ya tienes cuenta? Inicia sesión</a>
        </div>
        <div class="text-center mt-2">
            <a href="{{ url_for('tienda_catalogo') }}" class="text-decoration-none small text-muted">Volver al catálogo</a>
        </div>
    </div>
</body>
</html>
