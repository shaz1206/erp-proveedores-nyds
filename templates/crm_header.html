<script>
(function () {
    document.body.classList.add('has-app-sidebar');
    try {
        if (window.localStorage && localStorage.getItem('nyds_sidebar_oculto') === '1') {
            document.body.classList.add('app-sidebar-hidden');
        }
    } catch (e) {}
    window.nydsAlternarMenu = window.nydsAlternarMenu || function () {
        var oculto = document.body.classList.toggle('app-sidebar-hidden');
        try { localStorage.setItem('nyds_sidebar_oculto', oculto ? '1' : '0'); } catch (e) {}
    };
})();
</script>
<aside class="app-sidebar">
    <a class="app-sidebar-logo" href="/crm/tablero"><img src="{{ url_for('static', filename='nyds-logo.png') }}" alt="NYDS"></a>
    <div class="app-sidebar-kicker">CRM de pedidos</div>
    <nav class="app-sidebar-nav" aria-label="Módulos del CRM">
        <a href="/crm/pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Clientes</a>
        <a href="/crm/tablero"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Tablero</a>
        <a href="/crm/pedidos" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>Pedidos</a>
        <a href="/crm/pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Ruta</a>
        <a href="/crm/pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Pagos</a>
        <a href="/crm/logout" class="app-sidebar-logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Salir</a>
    </nav>
    <button type="button" class="app-sidebar-toggle" onclick="nydsAlternarMenu()" aria-label="Ocultar menú">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 15l-3-3 3-3"/><path d="M13 12h8"/></svg>
        Ocultar menú
    </button>
</aside>
<button type="button" class="app-sidebar-reopen" onclick="nydsAlternarMenu()" aria-label="Mostrar menú" title="Mostrar menú">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>
<div class="erp-toolbar">
    <span class="erp-context">CRM / {{ session.get('crm_nombre', 'Administrador ERP') }} / {{ rol or session.get('crm_rol', 'supervisor') }}</span>
    {% if session.get('admin_logueado') %}
    <a href="/admin/catalogo" class="btn btn-outline-secondary btn-sm">Volver al ERP</a>
    {% endif %}
</div>
