<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Producción{% endblock %} - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261019-v1-1-0') }}">
</head>
<body class="bg-light">
{% include 'erp_header.html' %}
<div class="container-fluid px-4 mb-5">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
    {% for categoria, mensaje in mensajes %}
    <div class="alert alert-{{ categoria }} py-2">{{ mensaje }}</div>
    {% endfor %}
    {% endwith %}
    <ul class="nav nav-pills mb-3 gap-1">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ('produccion_ordenes', 'produccion_detalle') else '' }}" href="{{ url_for('produccion_ordenes') }}">Órdenes de producción</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint == 'produccion_lista_compra' else '' }}" href="{{ url_for('produccion_lista_compra') }}">Lista de compra</a></li>
    </ul>
    {% block contenido %}{% endblock %}
</div>
</body>
</html>
