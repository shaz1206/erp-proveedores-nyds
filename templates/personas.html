<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Personas - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260911-nyds-white-logo') }}">
</head>
<body class="bg-light">
{% include 'erp_header.html' %}

<div class="container-fluid px-4 mb-5">
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-1">Personas y accesos</h4>
            <p class="text-muted mb-4">Cada quien entra con su propio usuario y contraseña. El rol define qué puede hacer: supervisor tiene acceso completo al ERP y al CRM; los demás roles solo entran al CRM.</p>

            <form id="formNuevaPersona" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Nombre completo</label>
                    <input id="nuevoNombre" class="form-control" required maxlength="180" placeholder="Ej. Ana López">
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-semibold">Usuario</label>
                    <input id="nuevoUsuario" class="form-control" required maxlength="60" placeholder="ana.lopez">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Rol</label>
                    <select id="nuevoRol" class="form-select">
                        {% for r in roles %}<option value="{{ r }}">{{ r|capitalize }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold">Contraseña</label>
                    <input id="nuevoPassword" type="password" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-primary" type="submit">+ Agregar persona</button>
                </div>
            </form>
            <div id="errorNuevaPersona" class="alert alert-danger mt-3 d-none"></div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Estatus</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="tablaPersonas"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const ROLES = {{ roles|tojson }};

    function escapeHtml(valor) {
        return String(valor ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function opcionesRol(rolActual) {
        return ROLES.map(r => `<option value="${r}" ${r === rolActual ? 'selected' : ''}>${r.charAt(0).toUpperCase() + r.slice(1)}</option>`).join('');
    }

    async function cargarPersonas() {
        const res = await fetch('/api/personas');
        if (res.status === 403) {
            window.location.href = '/login';
            return;
        }
        const personas = await res.json();
        const tb = document.getElementById('tablaPersonas');
        if (!personas.length) {
            tb.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-5">No hay personas registradas.</td></tr>`;
            return;
        }
        tb.innerHTML = personas.map(p => `
            <tr>
                <td class="fw-semibold">${escapeHtml(p.nombre)}${p.es_yo ? ' <span class="badge bg-light text-dark border">Tú</span>' : ''}</td>
                <td class="font-monospace">${escapeHtml(p.usuario)}</td>
                <td>
                    <select class="form-select form-select-sm" style="min-width:150px" onchange="cambiarRol(${p.id}, this.value)">
                        ${opcionesRol(p.rol)}
                    </select>
                </td>
                <td><span class="badge ${p.activo ? 'bg-success' : 'bg-secondary'}">${p.activo ? 'Activa' : 'Inactiva'}</span></td>
                <td class="text-end text-nowrap">
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="restablecerPassword(${p.id})">Restablecer contraseña</button>
                    ${p.activo
                        ? `<button class="btn btn-sm btn-outline-danger" onclick="cambiarEstatus(${p.id}, false)">Desactivar</button>`
                        : `<button class="btn btn-sm btn-outline-success" onclick="cambiarEstatus(${p.id}, true)">Activar</button>`}
                </td>
            </tr>`).join('');
    }

    async function actualizarPersona(id, payload) {
        const res = await fetch(`/api/personas/${id}`, {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            alert((data.error || 'No se pudo actualizar la persona') + (data.detalles ? '\n\n• ' + data.detalles.join('\n• ') : ''));
        }
        cargarPersonas();
    }

    function cambiarRol(id, rol) {
        actualizarPersona(id, {rol});
    }

    function cambiarEstatus(id, activo) {
        if (!activo && !confirm('¿Desactivar a esta persona? Ya no podrá iniciar sesión, pero su historial se conserva.')) {
            cargarPersonas();
            return;
        }
        actualizarPersona(id, {activo});
    }

    function restablecerPassword(id) {
        const password = prompt('Nueva contraseña (mínimo 6 caracteres):');
        if (password === null) return;
        if (password.length < 6) {
            alert('La contraseña debe tener al menos 6 caracteres.');
            return;
        }
        actualizarPersona(id, {password});
    }

    document.getElementById('formNuevaPersona').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorBox = document.getElementById('errorNuevaPersona');
        errorBox.classList.add('d-none');
        const payload = {
            nombre: document.getElementById('nuevoNombre').value,
            usuario: document.getElementById('nuevoUsuario').value,
            rol: document.getElementById('nuevoRol').value,
            password: document.getElementById('nuevoPassword').value,
        };
        const res = await fetch('/api/personas', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            errorBox.textContent = (data.error || 'No se pudo agregar la persona') + (data.detalles ? ' ' + data.detalles.join(' ') : '');
            errorBox.classList.remove('d-none');
            return;
        }
        document.getElementById('formNuevaPersona').reset();
        cargarPersonas();
    });

    cargarPersonas();
</script>
</body>
</html>
