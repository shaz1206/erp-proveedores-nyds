<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Acceso CRM - NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260914-crm-login') }}">
</head>
<body class="bg-light login-page d-flex align-items-center justify-content-center">
    <div class="card shadow border-0 p-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <div class="login-mark"><span class="nyds-logo"><img src="{{ url_for('static', filename='nyds-logo.png') }}" alt="NYDS" width="1600" height="900"></span></div>
            <h4 class="fw-bold text-dark">CRM de pedidos</h4>
            <small class="text-muted">Acceso para ventas, preparación, reparto y cobranza</small>
        </div>
        <div class="alert alert-danger" id="crmLoginError" {% if not error %}hidden{% endif %}>{{ error or '' }}</div>
        <form id="formCrmLogin" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" class="form-control" required placeholder="ventas.nyds">
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <input type="password" id="password" name="password" autocomplete="current-password" class="form-control" required placeholder="Contraseña">
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Entrar al CRM</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none small text-muted">Ir al acceso ERP</a>
        </div>
    </div>
    <script>
        document.getElementById('formCrmLogin').addEventListener('submit', async (event) => {
            event.preventDefault();
            const formData = new URLSearchParams();
            formData.append('usuario', document.getElementById('usuario').value);
            formData.append('password', document.getElementById('password').value);
            const response = await fetch('/crm/login', { method: 'POST', body: formData });
            if (response.ok) {
                window.location.href = '/crm/tablero';
            } else {
                const data = await response.json().catch(() => ({}));
                const errorBox = document.getElementById('crmLoginError');
                errorBox.textContent = data.error || 'Credenciales incorrectas';
                errorBox.hidden = false;
            }
        });
    </script>
</body>
</html>
