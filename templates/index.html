<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Proveedor - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-saas navbar-expand-lg mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-dark" href="/">🏢 ERP Módulo Proveedores</a>
            <a href="/" class="btn btn-sm btn-outline-secondary">← Volver al Catálogo</a>
        </div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <h4 class="fw-bold mb-4">Alta de Nuevo Proveedor</h4>
        
        <div class="card">
            <div class="card-body p-4">
                <form id="formProveedor">
                    <h6 class="text-uppercase text-muted fw-bold fs-7 mb-3">Datos Generales y Fiscales</h6>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Razón Social *</label>
                            <input type="text" class="form-control" id="razon_social" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">RFC *</label>
                            <input type="text" class="form-control text-uppercase" id="rfc" maxlength="13" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Tipo *</label>
                            <select class="form-select" id="tipo_proveedor">
                                <option value="Materia prima">Materia prima</option>
                                <option value="Empaque">Empaque</option>
                                <option value="Servicio">Servicio</option>
                                <option value="Mixto">Mixto</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Código Postal *</label>
                            <input type="text" class="form-control" id="codigo_postal" maxlength="5" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Condición de Pago *</label>
                            <select class="form-select" id="condicion_pago">
                                <option value="Contado">Contado</option>
                                <option value="Crédito 15 días">Crédito 15 días</option>
                                <option value="Crédito 30 días">Crédito 30 días</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Lead Time Habitual (Días) *</label>
                            <input type="number" class="form-control" id="lead_time_habitual" required>
                        </div>
                    </div>

                    <h6 class="text-uppercase text-muted fw-bold fs-7 mb-3 pt-2 border-top">Contacto Principal</h6>
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" id="contacto_nombre" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Correo Electrónico *</label>
                            <input type="email" class="form-control" id="contacto_correo" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Teléfono *</label>
                            <input type="text" class="form-control" id="contacto_telefono" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">Registrar Proveedor en el Sistema</button>
                </form>
                <div id="mensajeAlerta" class="alert mt-3 d-none" role="alert"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formProveedor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                razon_social: document.getElementById('razon_social').value,
                rfc: document.getElementById('rfc').value,
                tipo_proveedor: document.getElementById('tipo_proveedor').value,
                codigo_postal: document.getElementById('codigo_postal').value,
                condicion_pago: document.getElementById('condicion_pago').value,
                lead_time_habitual: parseFloat(document.getElementById('lead_time_habitual').value),
                contactos: [{
                    nombre: document.getElementById('contacto_nombre').value,
                    correo: document.getElementById('contacto_correo').value,
                    telefono: document.getElementById('contacto_telefono').value,
                    tipo_contacto: "Principal",
                    es_principal: true
                }]
            };

            const res = await fetch('/api/proveedores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            const alerta = document.getElementById('mensajeAlerta');
            alerta.classList.remove('d-none', 'alert-success', 'alert-danger');
            
            if(res.ok) {
                alerta.classList.add('alert-success');
                alerta.textContent = result.mensaje + " Redirigiendo...";
                setTimeout(() => window.location.href = '/', 1500);
            } else {
                alerta.classList.add('alert-danger');
                alerta.textContent = result.error;
            }
        });
    </script>
</body>
</html>
