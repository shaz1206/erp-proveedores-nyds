<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Nuevo Proveedor - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20260907-teal') }}">
</head>
<body class="bg-light">
    {% include 'erp_header.html' %}

    <div class="container mb-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-4 text-dark">Alta de Nuevo Proveedor (Multicategoría)</h4>
                
                <form id="formProveedor">
                    <h6 class="text-muted fw-bold mb-3">DATOS GENERALES Y FISCALES</h6>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Razón Social *</label>
                            <input type="text" id="razon_social" class="form-control" required placeholder="Ej. Químicos Industriales del Sureste S.A.">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">RFC *</label>
                            <input type="text" id="rfc" class="form-control" required placeholder="XAXX010101000">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Tipo Suministro *</label>
                            <select id="tipo_proveedor" class="form-select">
                                <option value="Materia Prima">Materia Prima (Químicos)</option>
                                <option value="Empaque">Material de Empaque</option>
                                <option value="Servicios">Servicios Industriales</option>
                                <option value="Mixto">Mixto (Varios)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Código Postal *</label>
                            <input type="text" id="codigo_postal" class="form-control" required placeholder="77500">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Condición de Pago *</label>
                            <select id="condicion_pago" class="form-select">
                                <option value="Contado">Contado</option>
                                <option value="Crédito 15 días">Crédito 15 días</option>
                                <option value="Crédito 30 días">Crédito 30 días</option>
                                <option value="Crédito 60 días">Crédito 60 días</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <!-- CAMBIADO: Texto claro en español -->
                            <label class="form-label fw-semibold">Tiempo de Entrega Normal (Días) *</label>
                            <input type="number" step="0.1" id="lead_time_habitual" class="form-control" required placeholder="Ej. 3">
                        </div>
                    </div>

                    <h6 class="text-muted fw-bold mb-3">CONTACTO PRINCIPAL</h6>
                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Nombre *</label>
                            <input type="text" id="contacto_nombre" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Correo Electrónico *</label>
                            <input type="email" id="contacto_correo" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Teléfono *</label>
                            <input type="text" id="contacto_telefono" class="form-control" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Registrar Proveedor en el Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formProveedor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                razon_social: document.getElementById('razon_social').value,
                rfc: document.getElementById('rfc').value,
                tipo_proveedor: document.getElementById('tipo_proveedor').value,
                codigo_postal: document.getElementById('codigo_postal').value,
                condicion_pago: document.getElementById('condicion_pago').value,
                tiempo_entrega_normal: parseFloat(document.getElementById('lead_time_habitual').value),
                contactos: [{
                    nombre: document.getElementById('contacto_nombre').value,
                    correo: document.getElementById('contacto_correo').value,
                    telefono: document.getElementById('contacto_telefono').value,
                    tipo_contacto: "Comercial Principal",
                    es_principal: true
                }]
            };

            const res = await fetch('/api/proveedores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if(res.ok) {
                alert(result.mensaje + " | Código: " + result.codigo);
                window.location.href = '/admin/catalogo';
            } else {
                alert("Error: " + result.error);
            }
        });
    </script>
</body>
</html>
