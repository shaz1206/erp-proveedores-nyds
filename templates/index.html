<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Nuevo Proveedor - ERP NYDS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='20261019-v1-1-0') }}">
</head>
<body class="bg-light">
    {% include 'erp_header.html' %}

    <div class="container mb-5" style="max-width: 800px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-1 text-dark">Nuevo proveedor</h4>
                <p class="text-muted mb-4">Solo el nombre es obligatorio. Teléfono y demás datos los capturas cuando los tengas.</p>

                <form id="formProveedor">
                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label fw-semibold" for="razon_social">Nombre *</label>
                            <input type="text" id="razon_social" class="form-control" required autofocus placeholder="Ej. Químicos Industriales del Sureste">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label fw-semibold" for="contacto_telefono">Teléfono</label>
                            <input type="tel" id="contacto_telefono" class="form-control" placeholder="Opcional">
                        </div>
                    </div>

                    <details class="mb-4">
                        <summary class="fw-semibold text-secondary mb-3" style="cursor:pointer">Más datos (opcionales)</summary>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label" for="rfc">RFC</label>
                                <input type="text" id="rfc" class="form-control" placeholder="XAXX010101000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="tipo_proveedor">Qué te vende</label>
                                <select id="tipo_proveedor" class="form-select">
                                    <option value="Materia Prima">Materia prima (químicos)</option>
                                    <option value="Empaque">Material de empaque</option>
                                    <option value="Servicios">Servicios industriales</option>
                                    <option value="Mixto">Mixto (varios)</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="codigo_postal">Código postal</label>
                                <input type="text" id="codigo_postal" class="form-control" inputmode="numeric" maxlength="5" placeholder="77500">
                            </div>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label class="form-label" for="condicion_pago">Condición de pago</label>
                                <select id="condicion_pago" class="form-select">
                                    <option value="">Sin definir</option>
                                    <option value="Contado">Contado</option>
                                    <option value="Crédito 15 días">Crédito 15 días</option>
                                    <option value="Crédito 30 días">Crédito 30 días</option>
                                    <option value="Crédito 60 días">Crédito 60 días</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="lead_time_habitual">Días de entrega</label>
                                <input type="number" step="0.1" min="0" id="lead_time_habitual" class="form-control" placeholder="Ej. 3">
                            </div>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="contacto_nombre">Nombre del contacto</label>
                                <input type="text" id="contacto_nombre" class="form-control" placeholder="Si lo dejas vacío se usa el nombre del proveedor">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="contacto_correo">Correo electrónico</label>
                                <input type="email" id="contacto_correo" class="form-control">
                            </div>
                        </div>
                    </details>

                    <div id="errorProveedor" class="alert alert-danger d-none"></div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="guardarProveedor">Guardar proveedor</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('formProveedor').addEventListener('submit', async (e) => {
            e.preventDefault();
            const v = (id) => document.getElementById(id).value.trim();
            const error = document.getElementById('errorProveedor');
            const boton = document.getElementById('guardarProveedor');
            error.classList.add('d-none');
            const data = {
                razon_social: v('razon_social'),
                estatus_inicial: 'Activo',
                tipo_proveedor: v('tipo_proveedor'),
            };
            if (v('contacto_telefono')) data.telefono = v('contacto_telefono');
            if (v('rfc')) data.rfc = v('rfc');
            if (v('codigo_postal')) data.codigo_postal = v('codigo_postal');
            if (v('condicion_pago')) data.condicion_pago = v('condicion_pago');
            if (v('lead_time_habitual')) data.tiempo_entrega_normal = parseFloat(v('lead_time_habitual'));
            if (v('contacto_nombre')) data.contacto_nombre = v('contacto_nombre');
            if (v('contacto_correo')) data.correo = v('contacto_correo');

            boton.disabled = true;
            try {
                const res = await fetch('/api/proveedores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    window.location.href = '/admin/catalogo';
                    return;
                }
                error.textContent = result.error || 'No se pudo guardar el proveedor.';
                error.classList.remove('d-none');
            } catch (err) {
                error.textContent = 'No se pudo conectar con el servidor.';
                error.classList.remove('d-none');
            } finally { boton.disabled = false; }
        });
    </script>
</body>
</html>
